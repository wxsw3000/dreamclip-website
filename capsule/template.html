<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>【标题】 · #【情绪】 · DreamClip</title>
    <meta name="description" content="【一句话简介】" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Noto+Sans+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

    <div class="container">

        <!-- ===== 导航（复制自其他页面，保持不变） ===== -->
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-moon"></i>
                <span class="dream">Dream</span><span class="clip">Clip</span>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="/" class="active">情绪胶囊</a>
                <a href="#">游戏库</a>
                <a href="#">日志</a>
                <a href="/about.html">关于</a>
                <a href="#" class="nav-cta"><i class="fas fa-play"></i> 开始玩</a>
            </div>
        </nav>

        <!-- ===== 胶囊头部（修改下面的内容） ===== -->
        <div class="capsule-header">
            <div class="breadcrumb">
                <a href="/">首页</a>  /  <span style="color:#8a8aa6;">#【情绪标签】</span>
            </div>
            <!-- 修改 mood-tag 后面的类名：insomnia / broken / heal / san / peace / twilight -->
            <span class="mood-tag insomnia">#【情绪】 · 【风格】</span>
            <h1>【标题】</h1>
            <div class="meta">
                <span><i class="far fa-calendar-alt"></i> 【日期】</span>
                <span><i class="far fa-clock"></i> 约 【X】 分钟</span>
                <span><i class="fas fa-star" style="color:#fbbf24;"></i> 【评分】</span>
            </div>
        </div>

        <!-- ===== 胶囊正文（这里是你的故事） ===== -->
        <div class="capsule-body">
            <img class="cover" src="/images/placeholder.jpg" alt="【封面描述】" />

            <div class="story">

                <p>在这里写上你的故事。</p>
                <p>每一段用 <code>&lt;p&gt;</code> 包裹。</p>
                <p class="highlight-text">需要强调的句子可以用这个类。</p>
                <p>故事结束后，加上分隔线和结尾标记。</p>

                <hr style="border-color: rgba(255,255,255,0.06); margin: 28px 0;" />

                <p style="text-align:center; color:#5a5a78; font-size:14px; margin-top:40px;">—— 完 ——</p>

            </div>
        </div>

        <!-- ===== 评论区 ===== -->
        <div class="comments-section">
            <h3><i class="far fa-comment"></i> 时空回响 · 留下你的吐槽</h3>
            <div class="placeholder">
                🌙 评论功能即将上线 · 你也可以在心里留下你的回响
            </div>
        </div>

        <!-- ===== 页脚 ===== -->
        <footer class="footer">
            <div class="footer-links">
                <a href="/about.html">关于我们</a>
                <a href="/privacy.html">隐私政策</a>
                <a href="/contact.html">联系我们</a>
            </div>
            <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
                <span>© 2026 DreamClip · 用爱发电</span>
                <div class="footer-social">
                    <a href="#" aria-label="B站"><i class="fab fa-bilibili"></i></a>
                    <a href="#" aria-label="微博"><i class="fab fa-weibo"></i></a>
                    <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </footer>

    </div>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('open');
        });
    </script>

</body>
</html>
