name: Deploy to Server via Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying site to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # 1. 切换到/创建项目目录
            WORKDIR="/var/www/dreamclip-website"
            if [ ! -d "$WORKDIR" ]; then
              sudo mkdir -p "$WORKDIR"
              sudo chown -R $USER:$USER "$WORKDIR"
              git clone https://github.com/${{ github.repository }}.git "$WORKDIR"
            fi
            
            cd "$WORKDIR"
            
            # 2. 拉取最新代码
            git fetch --all
            git reset --hard origin/main
            
            # 3. Docker 构建与重新部署
            CONTAINER_NAME="dreamclip-website"
            
            # 停止并删除旧容器（如果存在）
            if [ $(sudo docker ps -aq -f name=^/${CONTAINER_NAME}$) ]; then
              sudo docker stop $CONTAINER_NAME
              sudo docker rm $CONTAINER_NAME
            fi
            
            # 构建新镜像并启动（映射服务器 8080 端口）
            sudo docker build -t $CONTAINER_NAME:latest .
            sudo docker run -d --name $CONTAINER_NAME -p 8080:80 --restart always $CONTAINER_NAME:latest
            
            # 清理无用镜像
            sudo docker image prune -f
