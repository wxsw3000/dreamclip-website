name: Deploy to Server via Docker

run-name: "🚀 部署 DreamClip 站点到服务器"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying site to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # 1. 切换到/创建项目目录
            WORKDIR="/var/www/dreamclip-website"
            if [ ! -d "$WORKDIR" ]; then
              sudo mkdir -p "$WORKDIR"
              sudo chown -R $USER:$USER "$WORKDIR"
              git clone https://github.com/${{ github.repository }}.git "$WORKDIR"
            fi
            
            cd "$WORKDIR"
            
            # 2. 拉取最新代码
            git fetch --all
            git reset --hard origin/main
            
            # 3. Docker 构建与重新部署
            CONTAINER_NAME="dreamclip-website"
            
            # 停止并删除旧容器（如果存在）
            if [ $(sudo docker ps -aq -f name=^/${CONTAINER_NAME}$) ]; then
              sudo docker stop $CONTAINER_NAME
              sudo docker rm $CONTAINER_NAME
            fi
            
            # 构建新镜像并启动（使用 --net=host 模式直连宿主机 MySQL 8.0，注入安全环境变量）
            sudo docker build -t $CONTAINER_NAME:latest .
            sudo docker run -d --name $CONTAINER_NAME --net=host \
              -e MYSQL_USER="${{ secrets.MYSQL_USER || 'wxsw3000' }}" \
              -e MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
              --restart always $CONTAINER_NAME:latest
            
            # 清理无用镜像
            sudo docker image prune -f
