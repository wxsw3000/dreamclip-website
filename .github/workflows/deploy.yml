name: CI/CD Quality Gate & Production Deploy

run-name: "🛡️ 自动化质量门禁与生产部署 - ${{ github.actor }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ================================================================
  # Stage 1: CI 自动化质量门禁与端到端健康测试
  # (在 GitHub 免费云端虚拟机运行，100% 通过后才允许部署)
  # ================================================================
  ci_test:
    name: "🧪 CI 自动化测试与质量门禁"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出最新工程代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装平台与业务微服务依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r magicstar-platform/requirements.txt
          pip install -r dreamclip-service/requirements.txt
          pip install httpx fastapi pytest

      - name: 1. Python 全量语法编译与导入校验
        run: |
          echo "正在执行全工程代码编译检查..."
          python -m py_compile $(find magicstar-platform dreamclip-service -name "*.py")
          echo "✅ 语法编译校验 100% 通过！"

      - name: 2. 执行端到端核心链路与接口健康探测
        run: |
          echo "正在执行全链路自动化 Smoke Test..."
          python tests/ci_smoke_test.py
          echo "✅ 平台底座与业务微服务关键链路 100% 验证通过！"

  # ================================================================
  # Stage 2: CD 生产自动化部署
  # (依赖 Stage 1 质量门禁，仅在测试完全通过后触发)
  # ================================================================
  deploy:
    name: "🚀 CD 生产云服务器部署"
    needs: ci_test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: SSH 连接目标云服务器并执行安全无缝更新
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # 1. 切换到/创建项目目录
            WORKDIR="/var/www/dreamclip-website"
            if [ ! -d "$WORKDIR" ]; then
              sudo mkdir -p "$WORKDIR"
              sudo chown -R $USER:$USER "$WORKDIR"
              git clone https://github.com/${{ github.repository }}.git "$WORKDIR"
            fi
            
            cd "$WORKDIR"
            
            # 2. 强制拉取已通过 CI 验证的最新代码
            git fetch --all
            git reset --hard origin/main
            
            # 3. Docker 构建与重新部署
            CONTAINER_NAME="dreamclip-website"
            
            # 停止并删除旧容器（如果存在）
            if [ $(sudo docker ps -aq -f name=^/${CONTAINER_NAME}$) ]; then
              sudo docker stop $CONTAINER_NAME
              sudo docker rm $CONTAINER_NAME
            fi
            
            # 构建新镜像并启动（使用 --net=host 直连宿主机网络与 MySQL，注入安全密码）
            sudo docker build -t $CONTAINER_NAME:latest .
            sudo docker run -d --name $CONTAINER_NAME --net=host \
              -e MYSQL_USER="${{ secrets.MYSQL_USER || 'root' }}" \
              -e MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
              --restart always $CONTAINER_NAME:latest
            
            # 清理历史悬空镜像
            sudo docker image prune -f
            echo "✨ DreamClip & MagicStarPlatform 生产环境已成功部署上线！"
