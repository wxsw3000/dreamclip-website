<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>方案1：纯代码矢量拟物剧场 (0KB图片) - DreamClip</title>
  <meta name="description" content="方案1：纯代码 SVG & CSS3 矢量拟物剧场。0 外部图片依赖，体积仅 ~15KB，毫秒级瞬开，无限高清分辨率。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    :root {
      --primary: #6366f1;
      --cyan: #06b6d4;
      --gold: #f59e0b;
      --pink: #ec4899;
      --neon-gold: #fbbf24;
      --neon-blue: #38bdf8;
      --neon-purple: #c084fc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #060814;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    /* 场景外层视口 */
    .scene-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #151b38 0%, #060814 85%);
      overflow: hidden;
    }

    /* 1920x1080 等比缩放画布 */
    .scene-canvas {
      width: 1920px;
      height: 1080px;
      position: relative;
      flex-shrink: 0;
      transform-origin: center center;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1);
      box-shadow: 0 0 100px rgba(0, 0, 0, 0.95);
    }

    /* 纯 SVG 矢量剧院大门底图 */
    .svg-theater-facade {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* 顶部 HUD 导航条 */
    .theater-hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 62px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(6, 8, 20, 0.92) 0%, rgba(6, 8, 20, 0) 100%);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-logo {
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 1px;
    }

    .scheme-badge {
      font-size: 11.5px;
      font-weight: 700;
      color: #34d399;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.4);
      padding: 3px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 方案切换器 */
    .switcher-capsule {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 3px;
      gap: 2px;
      backdrop-filter: blur(12px);
    }

    .switcher-btn {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .switcher-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    .switcher-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.4);
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-btn {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    /* 场景镶嵌部件层 */
    .scene-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .region-hotspot {
      position: absolute;
      pointer-events: auto;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    /* 1. 门楣跑马灯 */
    .marquee-signboard {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(25, 20, 10, 0.95), rgba(5, 5, 5, 0.98));
      border: 3px solid #fbbf24;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), inset 0 0 20px rgba(245, 158, 11, 0.3);
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
    }

    .marquee-track {
      display: flex;
      white-space: nowrap;
      animation: led-scroll 24s linear infinite;
    }

    .marquee-item-text {
      font-size: 26px;
      font-weight: 800;
      color: #fde047;
      text-shadow: 0 0 10px #f59e0b, 0 0 20px rgba(245, 158, 11, 0.8);
      padding: 0 40px;
      letter-spacing: 2px;
      font-family: "Courier New", Courier, monospace, sans-serif;
    }

    @keyframes led-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* 2. 海报橱窗 */
    .poster-showcase {
      width: 100%;
      height: 100%;
      position: relative;
      border: 3px solid #38bdf8;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.35), inset 0 0 15px rgba(56, 189, 248, 0.2);
      background: #0b0f19;
      cursor: pointer;
    }

    .poster-slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.8s ease;
      transform: scale(1.03);
    }

    .poster-slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .poster-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .poster-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 14px 10px;
      background: linear-gradient(180deg, transparent 0%, rgba(10, 15, 30, 0.95) 80%);
    }

    .poster-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--primary);
      color: #fff;
      margin-bottom: 4px;
    }

    .poster-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* 3. 检票大门 */
    .ticket-btn {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(245, 158, 11, 0.95));
      border: 3px solid #fef08a;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6), 0 0 25px rgba(245, 158, 11, 0.5);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      padding: 10px;
      text-align: center;
    }

    .ticket-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 40px rgba(239, 68, 68, 0.8), 0 0 35px rgba(245, 158, 11, 0.7);
    }

    /* 4. 排期公告栏 */
    .bulletin-board {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(165, 180, 252, 0.4);
      border-radius: 8px;
      padding: 14px;
      overflow-y: auto;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(99, 102, 241, 0.25);
    }

    .bulletin-board::-webkit-scrollbar { width: 5px; }
    .bulletin-board::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 3px; }

    .bulletin-header {
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bulletin-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      color: #fff;
      margin-bottom: 6px;
    }

    .bulletin-item:hover { background: rgba(255, 255, 255, 0.12); }

    .bulletin-item-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(56, 189, 248, 0.25);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      white-space: nowrap;
      margin-top: 2px;
    }

    .bulletin-item-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* 5. 侧门/情绪信箱 */
    .sidedoor-btn {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.9), rgba(67, 56, 202, 0.9));
      border: 2px solid #a5b4fc;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
      cursor: pointer;
      transition: all 0.25s ease;
      padding: 6px;
    }

    .sidedoor-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.8);
    }

    /* 性能与特性悬浮卡 */
    .tech-metric-card {
      position: fixed;
      bottom: 24px;
      left: 28px;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 90;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .metric-val {
      font-weight: bold;
      color: #34d399;
    }

    /* SVG 动态霓虹灯呼吸动画 */
    @keyframes neonPulse {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.7)); opacity: 1; }
      50% { filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.95)); opacity: 0.9; }
    }
    .neon-arch-glow {
      animation: neonPulse 3s ease-in-out infinite;
    }

    @keyframes tubeFlicker {
      0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
      20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.65; }
    }
    .tube-flicker {
      animation: tubeFlicker 6s infinite;
    }
  </style>
</head>
<body>

  <!-- 顶部 HUD 导航 -->
  <header class="theater-hud">
    <div class="hud-brand">
      <div class="hud-logo">
        <span>🎭</span>
        <span>DreamClip 梦之剧院</span>
      </div>

    <!-- 方案快速切换胶囊 -->
    <nav class="switcher-capsule">

    </nav>

    <div class="hud-actions">
      <a href="/" class="hud-btn" title="返回梦之厅主站">🏛️ 返回梦之厅主站</a>
    </div>
  </header>

  <!-- 核心视口 -->
  <main class="scene-viewport" id="sceneViewport">
    <div class="scene-canvas" id="sceneCanvas">
      
      <!-- 纯 SVG 矢量绘制的赛博剧院正面大门 (0KB 图片依赖) -->
      <svg class="svg-theater-facade" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#040612"/>
            <stop offset="50%" stop-color="#0e1329"/>
            <stop offset="100%" stop-color="#1b203a"/>
          </linearGradient>

          <linearGradient id="facadeWall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e1b2e"/>
            <stop offset="60%" stop-color="#141221"/>
            <stop offset="100%" stop-color="#0a0913"/>
          </linearGradient>

          <linearGradient id="goldGlowGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="50%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#d97706"/>
          </linearGradient>

          <linearGradient id="neonCyanGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>

          <linearGradient id="groundFloor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a0c18"/>
            <stop offset="40%" stop-color="#080a14"/>
            <stop offset="100%" stop-color="#030408"/>
          </linearGradient>

          <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>

          <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>

        <!-- 背景夜空与远景浮空天际线 -->
        <rect x="0" y="0" width="1920" height="700" fill="url(#skyGrad)"/>
        
        <!-- 远景城市光晕与悬浮塔楼 -->
        <g opacity="0.4">
          <rect x="150" y="200" width="80" height="300" fill="#151b38"/>
          <rect x="250" y="160" width="120" height="340" fill="#1c2347"/>
          <rect x="1550" y="180" width="100" height="320" fill="#1c2347"/>
          <rect x="1680" y="220" width="90" height="280" fill="#151b38"/>
          <!-- 远景窗户星点 -->
          <circle cx="280" cy="220" r="1.5" fill="#38bdf8"/>
          <circle cx="310" cy="260" r="1.5" fill="#f472b6"/>
          <circle cx="1600" cy="240" r="1.5" fill="#38bdf8"/>
        </g>

        <!-- 剧院主建筑物外墙 -->
        <polygon points="120,780 120,280 480,180 960,120 1440,180 1800,280 1800,780" fill="url(#facadeWall)" stroke="#2e2b45" stroke-width="3"/>

        <!-- 剧院宏伟穹顶与 Art Deco 扇形放射装饰 -->
        <path d="M 480 180 Q 960 60 1440 180 Z" fill="#171526" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
        <line x1="960" y1="60" x2="960" y2="180" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
        <line x1="960" y1="60" x2="720" y2="180" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
        <line x1="960" y1="60" x2="1200" y2="180" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
        <line x1="960" y1="60" x2="580" y2="180" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
        <line x1="960" y1="60" x2="1340" y2="180" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>

        <!-- 拱门主轮廓 (金橙色霓虹发光外框) -->
        <path class="neon-arch-glow" d="M 420 800 L 420 340 Q 960 160 1500 340 L 1500 800 Z" fill="#0d0d1a" stroke="url(#goldGlowGrad)" stroke-width="6" filter="url(#glowGold)"/>

        <!-- 门头装饰带与浮雕横梁 -->
        <rect x="460" y="240" width="1000" height="24" rx="4" fill="#2d2212" stroke="#fbbf24" stroke-width="2"/>
        <circle cx="500" cy="252" r="5" fill="#fde047" filter="url(#glowGold)"/>
        <circle cx="960" cy="252" r="6" fill="#fde047" filter="url(#glowGold)"/>
        <circle cx="1420" cy="252" r="5" fill="#fde047" filter="url(#glowGold)"/>

        <!-- 侧立柱 (左立柱与右立柱) -->
        <g opacity="0.95">
          <!-- 左立柱 -->
          <rect x="360" y="320" width="50" height="480" fill="#1b182b" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)"/>
          <line x1="385" y1="330" x2="385" y2="790" stroke="#38bdf8" stroke-dasharray="8,6" stroke-width="2" class="tube-flicker"/>
          <!-- 右立柱 -->
          <rect x="1510" y="320" width="50" height="480" fill="#1b182b" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)"/>
          <line x1="1535" y1="330" x2="1535" y2="790" stroke="#38bdf8" stroke-dasharray="8,6" stroke-width="2" class="tube-flicker"/>
        </g>

        <!-- 剧场检票入场大门装饰框 -->
        <rect x="1300" y="460" width="400" height="200" rx="8" fill="#120c1a" stroke="#f43f5e" stroke-width="2" opacity="0.7"/>

        <!-- 地面湿润沥青与雨夜倒影反光 -->
        <rect x="0" y="780" width="1920" height="300" fill="url(#groundFloor)"/>
        <!-- 地面霓虹倒影光斑 -->
        <ellipse cx="960" cy="880" rx="450" ry="25" fill="#f59e0b" opacity="0.12" filter="url(#glowGold)"/>
        <ellipse cx="400" cy="850" rx="200" ry="15" fill="#38bdf8" opacity="0.15" filter="url(#glowCyan)"/>
        <ellipse cx="1450" cy="860" rx="220" ry="18" fill="#f43f5e" opacity="0.15"/>
      </svg>

      <!-- 动态镶嵌部件覆盖层 (走马灯/海报/检票/公告/侧门) -->
      <div class="scene-layer" id="sceneLayer"></div>
    </div>
  </main>

    </div>
  </aside>

  <!-- 脚本逻辑 -->
  <script>
    const THEATER_CONFIG = {
      regions: [
        {
          id: "region-marquee",
          name: "门楣 LED 走马灯",
          type: "marquee",
          position: { x: "28%", y: "13.8%", w: "44%", h: "6.2%" },
          defaultItems: [
            "⚡ 方案1演示：纯代码 SVG 矢量拟物剧场 ⚡",
            "✨ 0 KB 外部背景图片依赖，首屏毫秒级秒开 ✨",
            "🎬 第一章《最初的遗失信件》现已上线，点击海报即可免费体验"
          ]
        },
        {
          id: "region-poster",
          name: "橱窗海报墙",
          type: "poster-carousel",
          position: { x: "7.5%", y: "32%", w: "23%", h: "31%" },
          autoplayInterval: 4500
        },
        {
          id: "region-ticket",
          name: "剧院检票大门",
          type: "ticket-booth",
          position: { x: "69%", y: "44%", w: "19%", h: "16%" },
          label: "进入梦之剧院",
          sub: "🎬 开启 AVG 沉浸互动剧场",
          link: "/games"
        },
        {
          id: "region-notice",
          name: "排期公告栏",
          type: "notice-board",
          position: { x: "37%", y: "57%", w: "25.5%", h: "22%" },
          title: "📌 剧院最新排期与情绪胶囊"
        },
        {
          id: "region-sidedoor",
          name: "深空情绪信箱",
          type: "side-door",
          position: { x: "69%", y: "63%", w: "19%", h: "16%" },
          label: "深空情绪信箱",
          sub: "📮 投递与打捞情绪胶囊",
          link: "/capsules"
        }
      ]
    };

    const TheaterEngine = {
      data: { banners: [], worldview: null, capsules: [], avgChapters: [] },

      init() {
        const t0 = performance.now();
        this.bindResize();
        this.renderRegions();
        this.fetchData();
        window.addEventListener('load', () => {
          const loadTime = Math.round(performance.now() - t0);
          const el = document.getElementById('renderTime');
          if (el) el.innerText = `${loadTime} ms (瞬间渲染)`;
        });
      },

      bindResize() {
        const canvas = document.getElementById("sceneCanvas");
        const resize = () => {
          const vw = window.innerWidth;
          const vh = window.innerHeight;
          const scale = Math.min(vw / 1920, vh / 1080);
          canvas.style.transform = `scale(${scale})`;
        };
        window.addEventListener("resize", resize);
        resize();
      },

      renderRegions() {
        const layer = document.getElementById("sceneLayer");
        layer.innerHTML = "";

        THEATER_CONFIG.regions.forEach(r => {
          const box = document.createElement("div");
          box.className = "region-hotspot";
          box.id = r.id;
          box.style.left = r.position.x;
          box.style.top = r.position.y;
          box.style.width = r.position.w;
          box.style.height = r.position.h;

          if (r.type === "marquee") {
            box.innerHTML = `
              <div class="marquee-signboard">
                <div class="marquee-track" id="marqueeTrack">
                  ${r.defaultItems.map(t => `<span class="marquee-item-text">${t}</span>`).join("")}
                  ${r.defaultItems.map(t => `<span class="marquee-item-text">${t}</span>`).join("")}
                </div>
              </div>
            `;
          } else if (r.type === "poster-carousel") {
            box.innerHTML = `
              <div class="poster-showcase" id="posterShowcase" onclick="window.location.href='/games'">
                <div class="poster-slide active" id="posterSlideMain">
                  <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop" alt="深空信箱：2099">
                  <div class="poster-overlay">
                    <span class="poster-tag">正在热映</span>
                    <div class="poster-title">深空信箱：2099</div>
                  </div>
                </div>
              </div>
            `;
          } else if (r.type === "ticket-booth") {
            box.innerHTML = `
              <a href="${r.link}" class="ticket-btn">
                <span style="font-size:24px;margin-bottom:2px;">🎟️</span>
                <span style="font-size:18px;font-weight:800;">${r.label}</span>
                <span style="font-size:11px;opacity:0.9;">${r.sub}</span>
              </a>
            `;
          } else if (r.type === "notice-board") {
            box.innerHTML = `
              <div class="bulletin-board" id="bulletinBoard">
                <div class="bulletin-header">
                  <span>${r.title}</span>
                  <span style="font-size:10.5px;color:rgba(255,255,255,0.5);">LIVE</span>
                </div>
                <div id="bulletinList">
                  <a href="/capsule/1" class="bulletin-item">
                    <span class="bulletin-item-tag">胶囊</span>
                    <span class="bulletin-item-title">在遗忘的星穹边缘，打捞被世界遗弃的情绪信件</span>
                  </a>
                  <a href="/games" class="bulletin-item">
                    <span class="bulletin-item-tag">AVG</span>
                    <span class="bulletin-item-title">第一章：深空信使雷文的初次救援任务</span>
                  </a>
                </div>
              </div>
            `;
          } else if (r.type === "side-door") {
            box.innerHTML = `
              <a href="${r.link}" class="sidedoor-btn">
                <span style="font-size:22px;margin-bottom:2px;">📮</span>
                <span style="font-size:16px;font-weight:700;">${r.label}</span>
                <span style="font-size:11px;opacity:0.85;">${r.sub}</span>
              </a>
            `;
          }
          layer.appendChild(box);
        });
      },

      async fetchData() {
        try {
          const res = await fetch("/api/v1/hall/summary");
          if (res.ok) {
            const data = await res.json();
            if (data.banners && data.banners.length > 0) {
              const track = document.getElementById("marqueeTrack");
              if (track) {
                const items = data.banners.map(b => `✨ ${b.title}: ${b.subtitle || ''} ✨`);
                track.innerHTML = items.map(t => `<span class="marquee-item-text">${t}</span>`).join("") +
                                  items.map(t => `<span class="marquee-item-text">${t}</span>`).join("");
              }
            }
          }
        } catch (e) {
          console.log("Using seed showcase data");
        }
      }
    };

    document.addEventListener("DOMContentLoaded", () => TheaterEngine.init());
  </script>
</body>
</html>
