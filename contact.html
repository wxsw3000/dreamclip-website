<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联系我们 · DreamClip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Noto+Sans+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
        .contact-content {
            max-width: 620px;
            margin: 50px auto;
            padding: 0 16px;
            text-align: center;
        }
        .contact-content h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
        }
        .contact-content .sub {
            color: #7a7a98;
            font-size: 16px;
            margin-bottom: 32px;
        }
        .contact-card {
            background: rgba(255,255,255,0.02);
            border-radius: 20px;
            padding: 28px 24px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }
        .contact-card:hover {
            border-color: rgba(167, 139, 250, 0.15);
        }
        .contact-card .icon {
            font-size: 28px;
            color: #a78bfa;
            margin-bottom: 8px;
        }
        .contact-card .label {
            font-size: 14px;
            color: #6a6a88;
        }
        .contact-card .value {
            font-size: 18px;
            font-weight: 600;
            color: #e8e6f0;
        }
        .contact-card .value a {
            color: #a78bfa;
        }
        .contact-card .value a:hover {
            color: #c4b5fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-moon"></i>
                <span class="dream">Dream</span><span class="clip">Clip</span>
            </div>
            <div class="hamburger" id="hamburger">
                <i class="fas fa-bars"></i>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="/">情绪胶囊</a>
                <a href="#">游戏库</a>
                <a href="#">日志</a>
                <a href="/about.html">关于</a>
                <a href="#" class="nav-cta"><i class="fas fa-play"></i> 开始玩</a>
            </div>
        </nav>

        <div class="contact-content">
            <h1>💌 联系我们</h1>
            <p class="sub">如果你想聊聊故事、合作、或者只是深夜想找个人说说话——</p>

            <div class="contact-card">
                <div class="icon"><i class="fas fa-envelope"></i></div>
                <div class="label">邮箱</div>
                <div class="value"><a href="mailto:hello@dreamclip.cn">hello@dreamclip.cn</a></div>
            </div>

            <div class="contact-card">
                <div class="icon"><i class="fab fa-bilibili"></i></div>
                <div class="label">B站</div>
                <div class="value"><a href="#" target="_blank">@DreamClip</a></div>
            </div>

            <div class="contact-card">
                <div class="icon"><i class="fab fa-weibo"></i></div>
                <div class="label">微博</div>
                <div class="value"><a href="#" target="_blank">@DreamClip</a></div>
            </div>

            <div class="contact-card">
                <div class="icon"><i class="fab fa-twitter"></i></div>
                <div class="label">Twitter</div>
                <div class="value"><a href="#" target="_blank">@DreamClip</a></div>
            </div>

            <p style="color:#5a5a78; font-size:14px; margin-top:32px;">
                🌙 我们会在 24 小时内回复每一封邮件
            </p>
        </div>

        <footer class="footer">
            <div class="footer-links">
                <a href="/about.html">关于我们</a>
                <a href="/privacy.html">隐私政策</a>
                <a href="/contact.html">联系我们</a>
            </div>
            <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
                <span>© 2026 DreamClip · 用爱发电</span>
                <div class="footer-social">
                    <a href="#" aria-label="B站"><i class="fab fa-bilibili"></i></a>
                    <a href="#" aria-label="微博"><i class="fab fa-weibo"></i></a>
                    <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </footer>
    </div>
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => { navLinks.classList.toggle('open'); });
    </script>
</body>
</html>
