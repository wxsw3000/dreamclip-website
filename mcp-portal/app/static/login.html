<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一身份认证 - MagicStar & DreamClip SSO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
  <style>
    :root {
      --bg-dark: #050711;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.4);
      --purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.1) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 30px 16px;
      position: relative;
    }

    /* 动态粒子画布背景 */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* 光晕流光背景球 */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 1;
      animation: floatGlow 12s infinite alternate ease-in-out;
    }
    .ambient-glow-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
      top: -80px;
      left: 10%;
    }
    .ambient-glow-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.22) 0%, transparent 70%);
      bottom: -100px;
      right: 12%;
      animation-delay: -6s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -25px) scale(1.08); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* 酷炫毛玻璃卡片容器 */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 450px;
      margin: auto;
    }

    .login-card {
      position: relative;
      background: rgba(13, 19, 36, 0.78);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 26px;
      padding: 38px 34px 34px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 80px -15px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(99, 102, 241, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1, #06b6d4, #a855f7, transparent);
      opacity: 0.9;
    }

    /* 品牌徽标与标题 */
    .brand-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-container {
      position: relative;
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-orbit {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(6, 182, 212, 0.8));
      filter: blur(12px);
      opacity: 0.6;
      animation: pulseOrbit 4s infinite ease-in-out;
    }

    @keyframes pulseOrbit {
      0%, 100% { transform: scale(0.92); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.85; }
    }

    .logo-badge {
      position: relative;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #06b6d4 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .brand-subtitle {
      font-size: 12.5px;
      color: #94a3b8;
      margin-top: 5px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      display: inline-block;
      animation: blinkDot 2s infinite ease-in-out;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* 登录 / 注册 分段切换选项卡 (Tabs) */
    .auth-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn:hover {
      color: #ffffff;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(6, 182, 212, 0.35));
      color: #ffffff;
      border: 1px solid rgba(99, 102, 241, 0.6);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* 表单面板动画 */
    .form-panel {
      display: none;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .form-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 输入框组 */
    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .input-icon svg {
      width: 18px;
      height: 18px;
    }

    .form-control {
      width: 100%;
      height: 48px;
      padding: 0 44px 0 42px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;
      font-size: 14px;
      color: #f8fafc;
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .form-control::placeholder {
      color: #64748b;
      font-size: 13.5px;
    }

    .form-control:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: #6366f1;
      box-shadow: 
        0 0 0 3px rgba(99, 102, 241, 0.25),
        0 0 18px rgba(99, 102, 241, 0.25),
        inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .form-control:focus + .input-icon {
      color: #818cf8;
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .toggle-pwd:hover {
      color: #cbd5e1;
    }

    .toggle-pwd svg {
      width: 17px;
      height: 17px;
    }

    /* 酷炫发光按钮 */
    .btn-submit {
      position: relative;
      width: 100%;
      height: 48px;
      margin-top: 10px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 13px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: left 0.6s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.6), 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .btn-submit:hover::before {
      left: 100%;
    }

    .btn-submit:active {
      transform: translateY(0);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-submit:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 快捷切换链接 */
    .switch-mode-bar {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }

    .switch-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-left: 4px;
    }

    .switch-link:hover {
      color: #7dd3fc;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    /* 加载中 Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 错误抖动动画 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* 浮动提示 Toast */
    .toast-box {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-error {
      background: rgba(220, 38, 38, 0.9);
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .toast-success {
      background: rgba(22, 163, 74, 0.9);
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    /* 底部极简版权 */
    .footer-bar {
      position: relative;
      z-index: 10;
      margin-top: 20px;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.6);
      letter-spacing: 0.5px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 动态粒子画布 -->
  <canvas id="particleCanvas"></canvas>

  <!-- 氛围光晕 -->
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <!-- 登录/注册 卡片容器 -->
  <div class="login-wrapper">
    <div class="login-card" id="loginCard">
      
      <!-- 品牌头部 -->
      <div class="brand-section">
        <div class="logo-container">
          <div class="logo-orbit"></div>
          <div class="logo-badge">⭐</div>
        </div>
        <h1 class="brand-title">MagicStar & DreamClip</h1>
        <div class="brand-subtitle">
          <span class="status-dot"></span>
          <span>统一身份单点登录与注册中心 · SSO</span>
        </div>
      </div>

      <!-- 登录 / 注册 分段切换栏 -->
      <div class="auth-tabs">
        <button type="button" class="tab-btn active" id="tabLoginBtn" onclick="switchAuthMode('login')">
          <span>🔐 账号登录</span>
        </button>
        <button type="button" class="tab-btn" id="tabRegisterBtn" onclick="switchAuthMode('register')">
          <span>✨ 注册新账号</span>
        </button>
      </div>

      <!-- 1. 登录表单 -->
      <form id="loginForm" class="form-panel active" onsubmit="handleLogin(event)">
        <!-- 用户名 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              class="form-control" 
              placeholder="请输入账号 / 用户名" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="请输入安全密码" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('password', 'eyeIconLogin')" title="显示/隐藏密码">
              <svg id="eyeIconLogin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- 登录按钮 -->
        <button type="submit" id="submitBtn" class="btn-submit">
          <span>登 录 统 一 身 份</span>
        </button>

        <div class="switch-mode-bar">
          还没有账号？<a class="switch-link" onclick="switchAuthMode('register')">立即注册新账号 →</a>
        </div>
      </form>

      <!-- 2. 注册表单 -->
      <form id="registerForm" class="form-panel" onsubmit="handleRegister(event)">
        <!-- 用户名 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="reg_username" 
              class="form-control" 
              placeholder="设置账号 / 用户名 (3~32位字母数字)" 
              required 
              autocomplete="username"
            >
          </div>
        </div>

        <!-- 昵称/姓名 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </span>
            <input 
              type="text" 
              id="reg_realname" 
              class="form-control" 
              placeholder="用户昵称 / 显示名称" 
              required
            >
          </div>
        </div>

        <!-- 电子邮箱 (选填) -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input 
              type="email" 
              id="reg_email" 
              class="form-control" 
              placeholder="电子邮箱 (选填，用于安全通知)"
            >
          </div>
        </div>

        <!-- 设置密码 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="reg_password" 
              class="form-control" 
              placeholder="设置密码 (至少 6 位)" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('reg_password', 'eyeIconReg')" title="显示/隐藏密码">
              <svg id="eyeIconReg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- 确认密码 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="reg_confirm_password" 
              class="form-control" 
              placeholder="再次输入密码" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('reg_confirm_password', 'eyeIconRegConfirm')" title="显示/隐藏密码">
              <svg id="eyeIconRegConfirm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- 注册提交按钮 -->
        <button type="submit" id="regSubmitBtn" class="btn-submit">
          <span>✨ 注 册 统 一 账 号</span>
        </button>

        <div class="switch-mode-bar">
          已有账号？<a class="switch-link" onclick="switchAuthMode('login')">立即返回登录 →</a>
        </div>
      </form>

    </div>

    <!-- 极简微小版权 -->
    <div class="footer-bar">
      Modular Configuration Platform · Protected by MagicStar Core
    </div>
  </div>

  <!-- Toast 提示框 -->
  <div id="toastBox" class="toast-box">
    <span id="toastIcon">⚠️</span>
    <span id="toastMsg">提示内容</span>
  </div>

  <script>
    // ==================== 1. 粒子网络背景特效 ====================
    (function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const particleCount = 42;
      const maxDistance = 120;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = (Math.random() - 0.5) * 0.6;
          this.radius = Math.random() * 1.8 + 0.6;
          this.alpha = Math.random() * 0.6 + 0.2;
          this.color = Math.random() > 0.5 ? '#6366f1' : '#06b6d4';
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.alpha;
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // 绘制连线
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < maxDistance) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = '#6366f1';
              ctx.globalAlpha = (1 - dist / maxDistance) * 0.18;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }

        // 绘制粒子
        particles.forEach(p => {
          p.update();
          p.draw();
        });

        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ==================== 2. 登录 / 注册 模式切换 ====================
    function switchAuthMode(mode) {
      const tabLogin = document.getElementById('tabLoginBtn');
      const tabReg = document.getElementById('tabRegisterBtn');
      const formLogin = document.getElementById('loginForm');
      const formReg = document.getElementById('registerForm');

      if (mode === 'register') {
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
        formLogin.classList.remove('active');
        formReg.classList.add('active');
        document.getElementById('reg_username').focus();
      } else {
        tabReg.classList.remove('active');
        tabLogin.classList.add('active');
        formReg.classList.remove('active');
        formLogin.classList.add('active');
        document.getElementById('username').focus();
      }

      // 同步 URL 参数（不刷新页面）
      const url = new URL(window.location.href);
      url.searchParams.set('mode', mode);
      window.history.replaceState(null, '', url.toString());
    }

    // 初始化时根据 URL 参数或路径预置选项卡
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode') || params.get('tab');
      if (mode === 'register' || window.location.pathname.endsWith('/register')) {
        switchAuthMode('register');
      }
    });

    // ==================== 3. 密码显示/隐藏切换 ====================
    function togglePasswordVisibility(inputId, iconId) {
      const pwd = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!pwd || !icon) return;
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        pwd.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    // ==================== 4. 浮动提示框 Toast ====================
    let toastTimer = null;
    function showToast(msg, type = 'error') {
      const box = document.getElementById('toastBox');
      const msgEl = document.getElementById('toastMsg');
      const iconEl = document.getElementById('toastIcon');
      
      msgEl.innerText = msg;
      box.className = 'toast-box ' + (type === 'success' ? 'toast-success' : 'toast-error');
      iconEl.innerText = type === 'success' ? '✓' : '⚠️';
      
      box.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove('show');
      }, 3500);
    }

    // ==================== 5. 跳转目标解析与直通 ====================
    function handleAuthSuccess(accessToken, userInfo, isNewRegister = false) {
      // 本地持久化保存身份 Token
      localStorage.setItem('mcp_token', accessToken);
      localStorage.setItem('mcp_user', JSON.stringify(userInfo));
      localStorage.setItem('dreamclip_token', accessToken);
      localStorage.setItem('dreamclip_user', JSON.stringify(userInfo));

      const successMsg = isNewRegister
        ? "✨ 账号注册成功！正在开启应用门户..."
        : "身份验证成功，正在开启应用门户...";
      showToast(successMsg, "success");

      const params = new URLSearchParams(window.location.search);
      const redirectUrl = params.get('redirect');

      setTimeout(() => {
        const isOnline = window.location.hostname.endsWith('dreamclip.cn');
        let targetBase;

        if (redirectUrl && !redirectUrl.includes('login.dreamclip.cn')) {
          targetBase = redirectUrl;
        } else {
          targetBase = isOnline ? 'https://portal.dreamclip.cn/' : '/portal';
        }

        const joinChar = targetBase.includes('?') ? '&' : '?';
        const targetUrl = `${targetBase}${joinChar}mcp_token=${encodeURIComponent(accessToken)}&mcp_user=${encodeURIComponent(JSON.stringify(userInfo))}`;
        window.location.href = targetUrl;
      }, 380);
    }

    // ==================== 6. 统一登录逻辑 ====================
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const card = document.getElementById('loginCard');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showToast("请输入用户名和密码", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>正在验证凭证...</span>';

      const payload = { username, password };

      try {
        let resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok && resp.status === 404) {
          resp = await fetch('/api/base/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        let res;
        try {
          res = await resp.json();
        } catch (jsonErr) {
          throw new Error(`服务端响应异常 (HTTP ${resp.status})`);
        }

        if (res && res.code === 200 && res.data) {
          handleAuthSuccess(res.data.access_token, res.data.user_info, false);
        } else {
          showToast(res ? res.message : "登录失败，请检查账号密码", "error");
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 500);
          btn.disabled = false;
          btn.innerHTML = '<span>登 录 统 一 身 份</span>';
        }
      } catch (err) {
        showToast("登录连接异常: " + err.message, "error");
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 500);
        btn.disabled = false;
        btn.innerHTML = '<span>登 录 统 一 身 份</span>';
      }
    }

    // ==================== 7. 统一注册逻辑 ====================
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regSubmitBtn');
      const card = document.getElementById('loginCard');

      const username = document.getElementById('reg_username').value.trim();
      const realName = document.getElementById('reg_realname').value.trim();
      const email = document.getElementById('reg_email').value.trim() || undefined;
      const password = document.getElementById('reg_password').value;
      const confirmPassword = document.getElementById('reg_confirm_password').value;

      if (!username || username.length < 3) {
        showToast("用户名至少需要 3 位字符", "error");
        return;
      }
      if (!realName) {
        showToast("请输入用户昵称 / 姓名", "error");
        return;
      }
      if (!password || password.length < 6) {
        showToast("密码长度不能少于 6 位", "error");
        return;
      }
      if (password !== confirmPassword) {
        showToast("两次输入的密码不一致，请核对", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>正在创建统一账号...</span>';

      const payload = {
        username,
        password,
        real_name: realName,
        email: email
      };

      try {
        let resp = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok && resp.status === 404) {
          resp = await fetch('/api/base/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        let res;
        try {
          res = await resp.json();
        } catch (jsonErr) {
          throw new Error(`服务端响应异常 (HTTP ${resp.status})`);
        }

        if (res && res.code === 200 && res.data) {
          handleAuthSuccess(res.data.access_token, res.data.user_info, true);
        } else {
          showToast(res ? res.message : "注册失败，请更换用户名重试", "error");
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 500);
          btn.disabled = false;
          btn.innerHTML = '<span>✨ 注 册 统 一 账 号</span>';
        }
      } catch (err) {
        showToast("注册连接异常: " + err.message, "error");
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 500);
        btn.disabled = false;
        btn.innerHTML = '<span>✨ 注 册 统 一 账 号</span>';
      }
    }
  </script>
