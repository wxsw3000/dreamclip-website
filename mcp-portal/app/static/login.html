<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一身份认证 - MagicStar & DreamClip SSO</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
  <style>
    :root {
      --bg-dark: #050711;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.4);
      --purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.1) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 动态粒子画布背景 */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* 光晕流光背景球 */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 1;
      animation: floatGlow 12s infinite alternate ease-in-out;
    }
    .ambient-glow-1 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
      top: -80px;
      left: 10%;
    }
    .ambient-glow-2 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.22) 0%, transparent 70%);
      bottom: -100px;
      right: 12%;
      animation-delay: -6s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -25px) scale(1.08); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* 酷炫毛玻璃登录卡片 */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 0 20px;
    }

    .login-card {
      position: relative;
      background: rgba(13, 19, 36, 0.76);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 26px;
      padding: 44px 38px 38px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 30px 80px -15px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(99, 102, 241, 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1, #06b6d4, #a855f7, transparent);
      opacity: 0.9;
    }

    /* 品牌徽标与标题 */
    .brand-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-container {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-orbit {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(6, 182, 212, 0.8));
      filter: blur(14px);
      opacity: 0.6;
      animation: pulseOrbit 4s infinite ease-in-out;
    }

    @keyframes pulseOrbit {
      0%, 100% { transform: scale(0.92); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.85; }
    }

    .logo-badge {
      position: relative;
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #06b6d4 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-title {
      font-size: 23px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      display: inline-block;
      animation: blinkDot 2s infinite ease-in-out;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* 输入框组 */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .input-icon svg {
      width: 19px;
      height: 19px;
    }

    .form-control {
      width: 100%;
      height: 50px;
      padding: 0 46px 0 44px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      font-size: 14.5px;
      color: #f8fafc;
      outline: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .form-control::placeholder {
      color: #64748b;
      font-size: 14px;
    }

    .form-control:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: #6366f1;
      box-shadow: 
        0 0 0 3px rgba(99, 102, 241, 0.25),
        0 0 20px rgba(99, 102, 241, 0.25),
        inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .form-control:focus + .input-icon {
      color: #818cf8;
    }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .toggle-pwd:hover {
      color: #cbd5e1;
    }

    .toggle-pwd svg {
      width: 18px;
      height: 18px;
    }

    /* 酷炫发光登录按钮 */
    .btn-login {
      position: relative;
      width: 100%;
      height: 50px;
      margin-top: 10px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transition: left 0.6s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.6), 0 0 20px rgba(6, 182, 212, 0.4);
    }

    .btn-login:hover::before {
      left: 100%;
    }

    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-login:disabled {
      background: #334155;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 跳转至主站注册引导栏 */
    .register-guide-bar {
      margin-top: 22px;
      text-align: center;
      font-size: 13.5px;
      color: #94a3b8;
    }

    .register-link {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      margin-left: 6px;
      transition: all 0.2s ease;
    }

    .register-link:hover {
      color: #7dd3fc;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    /* 加载中 Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 错误抖动动画 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    /* 浮动提示 Toast */
    .toast-box {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-error {
      background: rgba(220, 38, 38, 0.9);
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .toast-success {
      background: rgba(22, 163, 74, 0.9);
      border: 1px solid rgba(74, 222, 128, 0.4);
    }

    /* 底部版权极简小字 */
    .footer-bar {
      position: relative;
      z-index: 10;
      margin-top: 24px;
      font-size: 12px;
      color: rgba(148, 163, 184, 0.6);
      letter-spacing: 0.5px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 动态粒子画布 -->
  <canvas id="particleCanvas"></canvas>

  <!-- 氛围光晕 -->
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>

  <!-- 登录卡片容器 -->
  <div class="login-wrapper">
    <div class="login-card" id="loginCard">
      
      <!-- 品牌头部 -->
      <div class="brand-section">
        <div class="logo-container">
          <div class="logo-orbit"></div>
          <div class="logo-badge">⭐</div>
        </div>
        <h1 class="brand-title">MagicStar & DreamClip</h1>
        <div class="brand-subtitle">
          <span class="status-dot"></span>
          <span>统一身份单点登录认证中心 · SSO</span>
        </div>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        
        <!-- 用户名 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              class="form-control" 
              placeholder="请输入身份账号 / 用户名" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <!-- 密码 -->
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              class="form-control" 
              placeholder="请输入安全密码" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="显示/隐藏密码">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- 登录按钮 -->
        <button type="submit" id="submitBtn" class="btn-login">
          <span id="btnText">登 录 统 一 身 份</span>
        </button>

        <!-- 注册引导 (直接通向主站通用注册地址) -->
        <div class="register-guide-bar">
          还没有账号？<a href="/register" id="toRegisterLink" class="register-link">立即注册新账号 →</a>
        </div>

      </form>
    </div>

    <!-- 极简微小版权 -->
    <div class="footer-bar">
      Modular Configuration Platform · Protected by MagicStar Core
    </div>
  </div>

  <!-- Toast 提示框 -->
  <div id="toastBox" class="toast-box">
    <span id="toastIcon">⚠️</span>
    <span id="toastMsg">提示内容</span>
  </div>

  <script>
    // ==================== 1. 动态校准主站注册跳转链接 ====================
    (function initLinks() {
      const isOnline = window.location.hostname.endsWith('dreamclip.cn');
      const regUrl = isOnline ? 'https://dreamclip.cn/register' : '/register';
      const regLink = document.getElementById('toRegisterLink');
      if (regLink) regLink.href = regUrl;

      // 若携带 mode=register 参数则直接跳转至主站注册
      const params = new URLSearchParams(window.location.search);
      if (params.get('mode') === 'register' || params.get('tab') === 'register') {
        window.location.href = regUrl;
      }
    })();

    // ==================== 2. 粒子网络背景特效 ====================
    (function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const particleCount = 42;
      const maxDistance = 120;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = (Math.random() - 0.5) * 0.6;
          this.vy = (Math.random() - 0.5) * 0.6;
          this.radius = Math.random() * 1.8 + 0.6;
          this.alpha = Math.random() * 0.6 + 0.2;
          this.color = Math.random() > 0.5 ? '#6366f1' : '#06b6d4';
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > width) this.vx *= -1;
          if (this.y < 0 || this.y > height) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.alpha;
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // 绘制连线
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < maxDistance) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = '#6366f1';
              ctx.globalAlpha = (1 - dist / maxDistance) * 0.18;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }

        // 绘制粒子
        particles.forEach(p => {
          p.update();
          p.draw();
        });

        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ==================== 3. 密码显示/隐藏切换 ====================
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        pwd.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    // ==================== 4. 浮动提示框 Toast ====================
    let toastTimer = null;
    function showToast(msg, type = 'error') {
      const box = document.getElementById('toastBox');
      const msgEl = document.getElementById('toastMsg');
      const iconEl = document.getElementById('toastIcon');
      
      msgEl.innerText = msg;
      box.className = 'toast-box ' + (type === 'success' ? 'toast-success' : 'toast-error');
      iconEl.innerText = type === 'success' ? '✓' : '⚠️';
      
      box.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        box.classList.remove('show');
      }, 3500);
    }

    // ==================== 5. 统一登录核心逻辑 ====================
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const card = document.getElementById('loginCard');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showToast("请输入用户名和密码", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div><span>正在验证凭证...</span>';

      const payload = { username, password };

      try {
        let resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok && resp.status === 404) {
          resp = await fetch('/api/base/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        let res;
        try {
          res = await resp.json();
        } catch (jsonErr) {
          throw new Error(`服务端响应异常 (HTTP ${resp.status})`);
        }

        if (res && res.code === 200 && res.data) {
          const accessToken = res.data.access_token;
          const userInfo = res.data.user_info;

          // 本地持久化保存身份 Token
          localStorage.setItem('mcp_token', accessToken);
          localStorage.setItem('mcp_user', JSON.stringify(userInfo));
          localStorage.setItem('dreamclip_token', accessToken);
          localStorage.setItem('dreamclip_user', JSON.stringify(userInfo));

          showToast("身份验证成功，正在开启应用门户...", "success");

          // 核心需求：无论何种情况，登录成功一律直达门户应用桌面 (PortalOS)
          setTimeout(() => {
            const isOnline = window.location.hostname.endsWith('dreamclip.cn');
            const portalBase = isOnline ? 'https://portal.dreamclip.cn/' : '/portal';
            const joinChar = portalBase.includes('?') ? '&' : '?';
            const targetUrl = `${portalBase}${joinChar}mcp_token=${encodeURIComponent(accessToken)}&mcp_user=${encodeURIComponent(JSON.stringify(userInfo))}`;
            window.location.href = targetUrl;
          }, 350);

        } else {
          showToast(res ? res.message : "登录失败，请检查账号密码", "error");
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 500);
          btn.disabled = false;
          btn.innerHTML = '<span>登 录 统 一 身 份</span>';
        }
      } catch (err) {
        showToast("登录连接异常: " + err.message, "error");
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 500);
        btn.disabled = false;
        btn.innerHTML = '<span>登 录 统 一 身 份</span>';
      }
    }
  </script>
