<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一单点登录 - MagicStar 模块化配置平台 (Modular Configuration Platform)</title>
  <link rel="stylesheet" href="/static/assets/css/portal.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>⭐</text></svg>">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #090d16 0%, #111827 50%, #1e1b4b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .login-container {
      width: 440px;
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(16px);
      padding: 42px 38px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #06b6d4 100%);
      border-radius: 16px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }
    .brand-header h2 {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }
    .brand-header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #6366f1;
      background: rgba(15, 23, 42, 1);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-login {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .quick-info {
      margin-top: 24px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      border-left: 3px solid #6366f1;
    }
    .quick-info code {
      color: #38bdf8;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.1);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .links-row {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 12.5px;
    }
    .links-row a {
      color: #94a3b8;
      text-decoration: none;
      transition: color 0.2s;
    }
    .links-row a:hover {
      color: #38bdf8;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="logo-badge">⭐</div>
      <h2>DreamClip & MagicStar</h2>
      <p>统一身份与单点登录中心 · login.dreamclip.cn (SSO)</p>
    </div>

    <div id="targetServiceHint" style="display:none; margin-bottom:18px; padding:10px 14px; background:rgba(99,102,241,0.15); border:1px solid rgba(165,180,252,0.3); border-radius:10px; font-size:12px; color:#c7d2fe; display:flex; align-items:center; gap:8px;">
      <span>💡</span>
      <span>登录成功后将自动返回您所访问的业务系统</span>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">统一身份账号 (用户名)</label>
        <input type="text" id="username" class="form-control" placeholder="请输入平台账号 / 用户名" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">安全登录密码</label>
        <input type="password" id="password" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn-login">
        登 录 统 一 身 份
      </button>

      <div class="links-row">
        <a href="https://portal.dreamclip.cn/">← 统一应用门户</a>
        <a href="https://universe.dreamclip.cn/">角色宇宙主站</a>
        <a href="https://base.dreamclip.cn/">底座控制台 →</a>
      </div>
    </form>
  </div>

  <div class="footer-note">
    MagicStar MCP & DreamClip SSO · 统一身份认证与单点登录中枢
  </div>

  <div id="toastBox" style="display:none; position:fixed; top:24px; right:24px; padding:12px 20px; background:#dc2626; color:#fff; border-radius:8px; font-size:13px; font-weight:600; z-index:9999; box-shadow:0 10px 25px rgba(0,0,0,0.3);"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirectUrl = urlParams.get('redirect');
      if (redirectUrl) {
        const hintEl = document.getElementById('targetServiceHint');
        if (hintEl) {
          hintEl.style.display = 'flex';
          try {
            const u = new URL(redirectUrl, window.location.origin);
            hintEl.innerHTML = `<span>💡</span><span>您正在登录并前往: <strong>${u.host || u.pathname}</strong></span>`;
          } catch(e) {}
        }
      }
    });

    function showToast(msg, bg = '#dc2626') {
      const box = document.getElementById('toastBox');
      box.innerText = msg;
      box.style.background = bg;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 3000);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "正在验证身份...";
      btn.disabled = true;

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        let resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) {
          resp = await fetch('/api/base/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }
        const res = await resp.json();

        if (res.code === 200 && res.data) {
          localStorage.setItem('mcp_token', res.data.access_token);
          localStorage.setItem('mcp_user', JSON.stringify(res.data.user_info));
          localStorage.setItem('dreamclip_token', res.data.access_token);
          localStorage.setItem('dreamclip_user', JSON.stringify(res.data.user_info));
          showToast("单点登录成功，正在进入...", "#16a34a");
          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect');
            if (redirectUrl) {
              let target = redirectUrl;
              if (target.startsWith('http://') || target.startsWith('https://')) {
                const joinChar = target.includes('?') ? '&' : '?';
                target = `${target}${joinChar}mcp_token=${encodeURIComponent(res.data.access_token)}&mcp_user=${encodeURIComponent(JSON.stringify(res.data.user_info))}`;
              } else {
                const isOnline = window.location.hostname.endsWith('dreamclip.cn');
                if (target.startsWith('/admin') || target.startsWith('/base')) {
                  target = isOnline ? `https://base.dreamclip.cn/?mcp_token=${encodeURIComponent(res.data.access_token)}&mcp_user=${encodeURIComponent(JSON.stringify(res.data.user_info))}` : target;
                } else if (target.startsWith('/portal') || target.startsWith('/workbench')) {
                  target = isOnline ? `https://portal.dreamclip.cn/?mcp_token=${encodeURIComponent(res.data.access_token)}&mcp_user=${encodeURIComponent(JSON.stringify(res.data.user_info))}` : target;
                }
              }
              window.location.href = target;
            } else {
              const isOnline = window.location.hostname.endsWith('dreamclip.cn');
              window.location.href = isOnline ? "https://portal.dreamclip.cn/" : "/portal";
            }
          }, 400);
        } else {
          showToast(res.message || "登录失败，请检查账号密码", "#dc2626");
          btn.innerText = "登 录 统 一 身 份";
          btn.disabled = false;
        }
      } catch (err) {
        showToast("服务连接异常: " + err.message, "#dc2626");
        btn.innerText = "登 录 统 一 身 份";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
