<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - MagicStar MCP 模块化配置平台</title>
  <link rel="stylesheet" href="/static/assets/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>⭐</text></svg>">
  <style>
    body {
      background: radial-gradient(circle at 10% 20%, #090d16 0%, #111827 50%, #1e1b4b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .login-card {
      width: 420px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      padding: 38px 34px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #3b82f6, #06b6d4);
      border-radius: 16px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #fff;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
    }
    .login-header h2 {
      font-size: 21px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.5px;
    }
    .login-header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 5px;
    }
    .quick-tips {
      margin-top: 22px;
      padding: 12px 14px;
      background: #f8fafc;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: #475569;
      border-left: 3px solid #6366f1;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 12.5px;
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">⭐</div>
      <h2>MagicStar MCP 控制台</h2>
      <p>Modular Configuration Platform · 模块化配置底座</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">管理员账号</label>
        <input type="text" id="username" class="form-control" value="superadmin" placeholder="输入超管账号" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">管理员密码</label>
        <input type="password" id="password" class="form-control" value="123456" placeholder="输入密码" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 11px; margin-top: 10px; font-size: 14.5px;">
        登 录 控 制 台
      </button>

      <div class="quick-tips">
        <strong>💡 系统预置超管凭据：</strong><br>
        账号：<code>superadmin</code> / 密码：<code>123456</code>
      </div>

      <a href="/" class="back-link">← 前往统一应用门户</a>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    function showToast(msg, type='info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "正在验证身份...";
      btn.disabled = true;

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const res = await resp.json();

        if (res.code === 200 && res.data) {
          localStorage.setItem('mcp_token', res.data.access_token);
          localStorage.setItem('mcp_user', JSON.stringify(res.data.user_info));
          showToast("登录成功，正在进入控制台...", "success");
          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect');
            window.location.href = redirectUrl || "/";
          }, 400);
        } else {
          showToast(res.message || "登录失败，请检查账号密码", "danger");
          btn.innerText = "登 录 控 制 台";
          btn.disabled = false;
        }
      } catch (err) {
        showToast("底座服务连接异常: " + err.message, "danger");
        btn.innerText = "登 录 控 制 台";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
