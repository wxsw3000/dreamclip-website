<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制台登录 - MagicStar MCP 模块化配置底座</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>">
  <style>
    :root {
      --bg-dark: #050711;
      --primary: #6366f1;
      --cyan: #06b6d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 45%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 0 20px;
    }

    .login-card {
      position: relative;
      background: rgba(13, 19, 36, 0.72);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 26px;
      padding: 44px 38px 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8), 0 0 50px rgba(99, 102, 241, 0.18);
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #6366f1, #06b6d4, transparent);
    }

    .brand-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-badge {
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 50%, #06b6d4 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .brand-title {
      font-size: 23px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.8px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-control {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      font-size: 14.5px;
      color: #f8fafc;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-login {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      transition: all 0.25s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(99, 102, 241, 0.6);
    }

    .toast-box {
      position: fixed;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-error { background: rgba(220, 38, 38, 0.95); }
    .toast-success { background: rgba(22, 163, 74, 0.95); }
  </style>
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand-section">
        <div class="logo-badge">⭐</div>
        <h1 class="brand-title">MagicStar MCP</h1>
        <div class="brand-subtitle">底座管理控制台</div>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <input type="text" id="username" class="form-control" placeholder="请输入管理员账号 / 用户名" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <input type="password" id="password" class="form-control" placeholder="请输入安全登录密码" required autocomplete="current-password">
        </div>
        <button type="submit" id="submitBtn" class="btn-login">登 录</button>
      </form>
    </div>
  </div>
  <div id="toastBox" class="toast-box"></div>

  <script>
    (function() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
      let pts = Array.from({length: 35}, () => ({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
        r: Math.random()*1.8 + 0.6,
        color: Math.random() > 0.5 ? '#6366f1' : '#06b6d4'
      }));
      function loop() {
        ctx.clearRect(0,0,w,h);
        for(let i=0; i<pts.length; i++) {
          for(let j=i+1; j<pts.length; j++) {
            let dx = pts[i].x-pts[j].x, dy = pts[i].y-pts[j].y, d = Math.sqrt(dx*dx+dy*dy);
            if (d < 120) {
              ctx.beginPath();
              ctx.moveTo(pts[i].x, pts[i].y);
              ctx.lineTo(pts[j].x, pts[j].y);
              ctx.strokeStyle = '#6366f1';
              ctx.globalAlpha = (1 - d/120)*0.15;
              ctx.stroke();
            }
          }
        }
        pts.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x<0 || p.x>w) p.vx *= -1;
          if (p.y<0 || p.y>h) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = 0.5;
          ctx.fill();
        });
        requestAnimationFrame(loop);
      }
      loop();
    })();

    function showToast(msg, type='error') {
      const box = document.getElementById('toastBox');
      box.innerText = msg;
      box.className = 'toast-box ' + (type === 'success' ? 'toast-success' : 'toast-error') + ' show';
      setTimeout(() => box.classList.remove('show'), 3000);
    }

    function setAuthCookie(name, value, days = 7) {
      const isOnline = window.location.hostname.endsWith('dreamclip.cn');
      const domainPart = isOnline ? '; domain=.dreamclip.cn' : '';
      const maxAge = days > 0 ? `; max-age=${days * 24 * 60 * 60}` : '; max-age=0';
      document.cookie = `${name}=${encodeURIComponent(value)}${domainPart}; path=/; SameSite=Lax${maxAge}`;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "正在登录...";
      btn.disabled = true;

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        let res;
        try { res = await resp.json(); } catch(err) { throw new Error(`HTTP ${resp.status}`); }

        if (res && res.code === 200 && res.data) {
          setAuthCookie('mcp_token', res.data.access_token, 7);
          setAuthCookie('mcp_user', JSON.stringify(res.data.user_info), 7);
          setAuthCookie('dreamclip_token', res.data.access_token, 7);
          setAuthCookie('dreamclip_user', JSON.stringify(res.data.user_info), 7);
          localStorage.setItem('mcp_token', res.data.access_token);
          localStorage.setItem('mcp_user', JSON.stringify(res.data.user_info));
          localStorage.setItem('dreamclip_token', res.data.access_token);
          localStorage.setItem('dreamclip_user', JSON.stringify(res.data.user_info));
          showToast("登录成功，正在进入应用门户...", "success");
          setTimeout(() => {
            const isOnline = window.location.hostname.endsWith('dreamclip.cn');
            const portalUrl = isOnline ? 'https://portal.dreamclip.cn/' : '/portal';
            const joinChar = portalUrl.includes('?') ? '&' : '?';
            window.location.href = `${portalUrl}${joinChar}mcp_token=${encodeURIComponent(res.data.access_token)}&mcp_user=${encodeURIComponent(JSON.stringify(res.data.user_info))}`;
          }, 350);
        } else {
          showToast(res ? res.message : "登录失败，请检查账号密码", "error");
          btn.innerText = "登 录";
          btn.disabled = false;
        }
      } catch (err) {
        showToast("服务连接异常: " + err.message, "error");
        btn.innerText = "登 录";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
