<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - MagicStar MCP 模块化配置平台</title>
  <link rel="stylesheet" href="/static/assets/css/admin.css?v=20260918_v100">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>⭐</text></svg>">
  <style>
    body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(79, 70, 229, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(2, 132, 199, 0.08) 0%, transparent 45%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .login-card {
      width: 410px;
      background: #ffffff;
      padding: 38px 34px;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
    }
    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      border-radius: 12px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .login-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.2px;
    }
    .login-header p {
      font-size: 12.5px;
      color: #64748b;
      margin-top: 4px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 12.5px;
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .back-link:hover {
      color: #4f46e5;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">⭐</div>
      <h2>MagicStar MCP 控制台</h2>
      <p>Modular Configuration Platform · 模块化配置底座</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">管理员账号</label>
        <input type="text" id="username" class="form-control" placeholder="请输入管理员账号" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">管理员密码</label>
        <input type="password" id="password" class="form-control" placeholder="请输入密码" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px; margin-top: 12px; font-size: 14px; font-weight: 600;">
        登 录 控 制 台
      </button>

      <a href="/" class="back-link">← 前往统一应用门户</a>
    </form>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    function showToast(msg, type='info') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.innerText = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "正在验证身份...";
      btn.disabled = true;

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const resp = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const res = await resp.json();

        if (res.code === 200 && res.data) {
          localStorage.setItem('mcp_token', res.data.access_token);
          localStorage.setItem('mcp_user', JSON.stringify(res.data.user_info));
          showToast("登录成功，正在进入控制台...", "success");
          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get('redirect');
            window.location.href = redirectUrl || "/";
          }, 400);
        } else {
          showToast(res.message || "登录失败，请检查账号密码", "danger");
          btn.innerText = "登 录 控 制 台";
          btn.disabled = false;
        }
      } catch (err) {
        showToast("底座服务连接异常: " + err.message, "danger");
        btn.innerText = "登 录 控 制 台";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
